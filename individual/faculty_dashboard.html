<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Faculty Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="sidebar">
    <div class="logo">EduTrack</div>
    <ul class="nav">
      <li class="active"><a href="faculty_dashboard.html">🏠 Dashboard</a></li>
      <li><a href="#">🧑‍🏫 Sessions</a></li>
      <li><a href="#">⚙️ Settings</a></li>
      <li><a href="#">🚪 Logout</a></li>
    </ul>
  </div>

  <div class="main-content">
    <header>
      <h1>Welcome, Faculty 👋</h1>
      <p>Manage sessions, attendance, and lab details.</p>
    </header>

    <section class="stats">
      <div class="card red">
        <h3>Total Classes</h3>
        <p>12</p>
      </div>
      <div class="card">
        <h3>Labs/Practicals</h3>
        <p>5</p>
      </div>
      <div class="card">
        <h3>Comments Added</h3>
        <p>8</p>
      </div>
    </section>

    <section class="attendance">
      <h2>Session Management</h2>
      <button class="btn" id="addSessionBtn">➕ Add Session</button>

      <table id="sessionTable">
        <thead>
          <tr>
            <th>Date</th>
            <th>Course</th>
            <th>Type</th>
            <th>Comment</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </div>

  <!-- Modal -->
  <div id="sessionModal" class="modal">
    <div class="modal-content">
      <h2>Add / Edit Session</h2>
      <label>Date:</label>
      <input type="date" id="sessionDate" required>
      <label>Course:</label>
      <input type="text" id="sessionCourse" placeholder="e.g., CSC201" required>
      <label>Type:</label>
      <select id="sessionType">
        <option value="Lecture">Lecture</option>
        <option value="Lab">Lab / Practical</option>
      </select>
      <label>Comment:</label>
      <textarea id="sessionComment" placeholder="Enter session details"></textarea>

      <div class="modal-buttons">
        <button id="saveSession" class="btn">Save</button>
        <button id="closeModal" class="btn cancel">Cancel</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
