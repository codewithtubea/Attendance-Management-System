<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ashesi Portal | Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <h1 class="logo">Ashesi Portal</h1>
      <ul class="nav-links">
        <li><a href="index.html" class="active">Login</a></li>
        <li><a href="register.html">Register</a></li>
      </ul>
    </div>
  </nav>

  <div class="form-container">
    <form class="form-box" id="login-form">
      <h2>Login</h2>

      <div class="input-group">
        <label>Email</label>
        <input type="email" placeholder="Enter your email" required>
      </div>

      <div class="input-group password-group">
        <label>Password</label>
        <input type="password" id="login-password" placeholder="Enter your password" required>
        <span class="toggle-password" onclick="togglePassword('login-password', this)">👁️</span>
      </div>

      <button type="submit" class="btn">Login</button>
      <p class="redirect-text">Don’t have an account? <a href="register.html">Register</a></p>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
