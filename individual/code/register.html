<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ashesi Portal | Register</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <div class="nav-container">
      <h1 class="logo">Ashesi Portal</h1>
      <ul class="nav-links">
        <li><a href="index.html">Login</a></li>
        <li><a href="register.html" class="active">Register</a></li>
      </ul>
    </div>
  </nav>

  <!-- Registration Form -->
  <div class="form-container">
    <form class="form-box" id="register-form">
      <h2>Register</h2>

      <div class="input-group">
        <label>Full Name</label>
        <input type="text" placeholder="Enter your full name" required>
      </div>

      <div class="input-group">
        <label>Email</label>
        <input type="email" placeholder="Enter your email" required>
      </div>

      <div class="input-group">
        <label>Role</label>
        <select required>
          <option value="">Select your role</option>
          <option value="student">Student</option>
          <option value="faculty">Faculty</option>
        </select>
      </div>

      <div class="input-group password-group">
        <label>Password</label>
        <input type="password" id="register-password" placeholder="Create a password" required>
        <span class="toggle-password" onclick="togglePassword('register-password', this)">👁️</span>
      </div>

      <button type="submit" class="btn">Register</button>
      <p class="redirect-text">Already have an account? <a href="index.html">Login</a></p>
    </form>
  </div>

  <!-- Success Modal -->
  <div id="successModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" id="closeModal">&times;</span>
      <h2>✅ Registration Successful!</h2>
      <p>Welcome to the Ashesi Portal. You can now log in to access your dashboard.</p>
      <a href="index.html" class="modal-btn">Go to Login</a>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
