<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Ashesi Portal — Courses</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar collapsed">
      <div class="brand">
        <div class="brand-mark">A</div>
        <div class="brand-text">
          <strong>Ashesi</strong>
          <small>Portal</small>
        </div>
      </div>
      <nav class="nav">
        <button class="nav-item" onclick="location.href='student_dashboard.html'"><span class="icon">🏠</span><span class="label">Dashboard</span></button>
        <button class="nav-item active"><span class="icon">📚</span><span class="label">Courses</span></button>
      </nav>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="search"><input placeholder="Search courses..." /></div>
        <div class="top-actions"><div class="profile"><div class="avatar">T</div></div></div>
      </header>

      <div class="content" id="coursesPage">
        <section class="section">
          <div class="section-header">
            <h2>Your Courses</h2>
            <div class="muted">Tap a course to view attendance & sessions</div>
          </div>

          <div class="courses-grid large">
            <article class="course-card">
              <h3>Web Technologies</h3>
              <p class="muted">Dr. Mensah</p>
              <div class="course-meta"><span class="badge lecture">Lecture</span><span class="badge lab">Lab</span></div>
              <div class="card-actions">
                <button class="btn primary">View Attendance</button>
                <button class="btn outline">Open Course</button>
              </div>
            </article>

            <article class="course-card">
              <h3>Data Structures</h3>
              <p class="muted">Prof. Agyapong</p>
              <div class="course-meta"><span class="badge lecture">Lecture</span></div>
              <div class="card-actions">
                <button class="btn primary">View Attendance</button>
                <button class="btn outline">Open Course</button>
              </div>
            </article>

            <article class="course-card">
              <h3>Algorithms</h3>
              <p class="muted">Dr. Boateng</p>
              <div class="course-meta"><span class="badge lecture">Lecture</span></div>
              <div class="card-actions">
                <button class="btn primary">View Attendance</button>
                <button class="btn outline">Open Course</button>
              </div>
            </article>

            <article class="course-card">
              <h3>Database Systems</h3>
              <p class="muted">Ms. Tetteh</p>
              <div class="course-meta"><span class="badge lab">Lab</span></div>
              <div class="card-actions">
                <button class="btn primary">View Attendance</button>
                <button class="btn outline">Open Course</button>
              </div>
            </article>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
